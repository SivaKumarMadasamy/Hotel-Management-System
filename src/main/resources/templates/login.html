<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Title</title></head>
<body>
<div layout:fragment="content">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-circle fa-3x"></i>
            <h2>Welcome Back</h2>
            <p>Login to your account to continue</p>
        </div>
        <form th:action="@{/login}" method="POST">
            <div class="form-group input-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-group input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block auth-btn">Login</button>
        </form>
        <p class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Create one</a>
        </p>
    </div>
</div>
</div>
</body>
</html>
