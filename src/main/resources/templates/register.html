<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Title</title></head>
<body>
<div layout:fragment="content">
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus fa-3x" style="color: #2ecc71;"></i>
            <h2>Create Account</h2>
            <p>Join us to book your perfect stay</p>
        </div>
        <form th:action="@{/register}" method="POST">
            <div class="form-group input-icon">
                <i class="fas fa-user"></i>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="form-group input-icon">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="form-group input-icon">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-success btn-block auth-btn">Register</button>
        </form>
        <p class="auth-footer">
            Already have an account? <a th:href="@{/login}">Login here</a>
        </p>
    </div>
</div>
</div>
</body>
</html>
