<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a th:href="@{/}"><i class="fas fa-hotel"></i> Grand Hotel</a>
        </div>
        <ul class="nav-links">
            <li><a th:href="@{/}">Home</a></li>
            <th:block th:if="${session.user_id != null}">
                <th:block th:if="${session.role == 'admin'}">
                    <li><a th:href="@{/dashboard}">Admin Dashboard</a></li>
                    <li><a th:href="@{/complaints}">Complaints</a></li>
                </th:block>
                <li><a th:href="@{/rooms}">Rooms</a></li>
                <li><a th:href="@{/bookings}">Bookings</a></li>
                <li><a th:href="@{/logout}" style="color: #ffcccc;">Logout ([[${session.username}]])</a></li>
            </th:block><th:block th:unless="${session.user_id != null}">
                <li><a th:href="@{/login}">Login</a></li>
                <li><a th:href="@{/register}">Register</a></li>
            </th:block>
        </ul>
    </nav>

    <div class="container">
        <div th:if="${success}" class="alert alert-success">
            <span th:text="${success}"></span>
            <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
        </div>
        <div th:if="${danger}" class="alert alert-danger">
            <span th:text="${danger}"></span>
            <span class="closebtn" onclick="this.parentElement.style.display='none';">&times;</span>
        </div>
        
        <div layout:fragment="content"></div>
    </div>

    <footer>
        <p>&copy; 2024 Grand Hotel Management System. All rights reserved.</p>
    </footer>

    <script th:src="@{/script.js}"></script>
</body>
</html>
