<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Title</title></head>
<body>

<div layout:fragment="content">
<div class="form-container">
    <h2>Submit a Complaint</h2>
    <p>We are sorry for any inconvenience. Please let us know the issue.</p>
    <form th:action="@{/add_complaint}" method="POST">
        <div class="form-group">
            <label for="customer_name">Your Name</label>
            <input type="text" id="customer_name" name="customer_name" required>
        </div>
        
        <div class="form-group">
            <label for="room_number">Room Number</label>
            <input type="text" id="room_number" name="room_number" required>
        </div>
        
        <div class="form-group">
            <label for="complaint">Issue Description</label>
            <textarea id="complaint" name="complaint" rows="5" required placeholder="Please describe your issue in detail..."></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Submit Complaint</button>
    </form>
</div>
</div>
</body>
</html>
