<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Grand Hotel — Add Room</title></head>
<body>

<div layout:fragment="content">
<div class="form-container">
    <h2><i class="fas fa-plus-circle" style="color:var(--gold); margin-right:0.5rem;"></i> Add New Room</h2>
    <p>Fill in the details below to register a new room.</p>
    <form th:action="@{/add_room}" method="POST">
        <div class="form-group">
            <label for="room_number">Room Number</label>
            <input type="text" id="room_number" name="room_number" placeholder="e.g. 101" required>
        </div>

        <div class="form-group">
            <label for="room_type">Room Type</label>
            <select id="room_type" name="room_type" required>
                <option value="Single">Single</option>
                <option value="Double">Double</option>
                <option value="Deluxe">Deluxe</option>
                <option value="Suite">Suite</option>
            </select>
        </div>

        <div class="form-group">
            <label for="price">Price Per Night (Rs.)</label>
            <input type="number" id="price" name="price" step="0.01" min="0" placeholder="0.00" required>
        </div>

        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Room</button>
            <a th:href="@{/rooms}" class="btn btn-secondary"><i class="fas fa-times"></i> Cancel</a>
        </div>
    </form>
</div>
</div>
</body>
</html>
