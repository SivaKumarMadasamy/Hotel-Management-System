<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{base}">
<head><title>Title</title></head>
<body>

<div layout:fragment="content">
<div class="page-header">
    <h2>Manage Rooms</h2>
    <th:block th:if="${session.role == 'admin'}">
        <a th:href="@{/add_room}" class="btn btn-primary">Add Room</a>
    </th:block>
</div>

<table class="data-table">
    <thead>
        <tr>
            <th>Room Number</th>
            <th>Type</th>
            <th>Price / Night</th>
            <th>Status</th>
            <th th:if="${session.role == 'admin'}">Actions</th>
        </tr>
    </thead>
    <tbody>
        <th:block th:each="room : ${rooms}">
        <tr>
            <td>[[${room.room_number}]]</td>
            <td>[[${room.room_type}]]</td>
            <td>Rs.[[${#numbers.formatDecimal(room.price, 1, 2)}]]</td>
            <td>
                <span th:class="${room.status == 'Available' ? 'badge badge-success' : 'badge badge-danger'}">
                    [[${room.status}]]
                </span>
            </td>
            <td class="action-buttons" th:if="${session.role == 'admin'}">
                <a th:href="@{/edit_room/{id}(id=${room.id})}" class="btn-small btn-warning"><i class="fas fa-edit"></i> Edit</a>
                <form th:action="@{/delete_room/{id}(id=${room.id})}" method="POST" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this room?');">
                    <button type="submit" class="btn-small btn-danger"><i class="fas fa-trash"></i> Delete</button>
                </form>
            </td>
        </tr>
        </th:block>
        
        <tr th:if="${#lists.isEmpty(rooms)}">
            <td colspan="5" class="text-center">No rooms found.</td>
        </tr>
    </tbody>
</table>
</div>
</body>
</html>
